<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login</title>

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg, #2c3e50, #34495e);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

.card {
  background: white;
  padding: 30px;
  border-radius: 10px;
  width: 320px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  text-align: center;
}

h2 {
  margin-bottom: 20px;
}

.input-group {
  text-align: left;
  margin-bottom: 15px;
}

label {
  font-size: 14px;
  color: #555;
}

input {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  border: 1px solid #ccc;
  border-radius: 5px;
  box-sizing: border-box;
}

button {
  width: 100%;
  padding: 12px;
  background: #27ae60;
  color: white;
  border: none;
  border-radius: 5px;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  background: #219150;
}
</style>

</head>

<body>

<div class="card">

<h2>🔐 Iniciar Sesión</h2>

<div class="input-group">
  <label>Usuario</label>
  <input id="user">
</div>

<div class="input-group">
  <label>Contraseña</label>
  <input id="pass" type="password">
</div>

<button onclick="login()">Entrar</button>

</div>

<script>
async function login() {

  const res = await fetch('/api/login', {
    method: 'POST',
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      username: document.getElementById("user").value,
      password: document.getElementById("pass").value
    })
  });

  const data = await res.json();

  if (data.ok) {
    localStorage.setItem("auth", "true");
    localStorage.setItem("role", data.role);
    window.location.href = "/menu";
  } else {
    alert("Datos incorrectos");
  }
}
</script>

</body>
</html>
