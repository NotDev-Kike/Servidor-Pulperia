<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Panel</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f4f6f9;
}

.header {
  background: #2c3e50;
  color: white;
  padding: 15px;
  font-size: 20px;
  display: flex;
  justify-content: space-between;
}

.header button {
  background: #e74c3c;
  border: none;
  color: white;
  padding: 8px 12px;
  cursor: pointer;
}

.container {
  padding: 20px;
}

.menu-buttons button {
  padding: 12px;
  margin: 5px;
  font-size: 15px;
  border: none;
  cursor: pointer;
  border-radius: 6px;
}

.btn-prod { background: #3498db; color: white; }
.btn-ventas { background: #27ae60; color: white; }
.btn-usuarios { background: #8e44ad; color: white; }

table {
  width: 100%;
  border-collapse: collapse;
  background: white;
  margin-top: 20px;
}

th {
  background: #34495e;
  color: white;
}

th, td {
  padding: 10px;
  border: 1px solid #ccc;
  text-align: center;
}

tr:hover {
  background: #f1f1f1;
}

.resumen {
  margin-top: 20px;
  background: white;
  padding: 15px;
  border-radius: 5px;
}

.actions button {
  margin: 2px;
  padding: 5px 10px;
  cursor: pointer;
}
</style>

</head>

<body>

<div class="header">
  <span>📊 Panel de Control</span>
  <div>
    <button onclick="irMenu()">⬅ Menú</button>
  </div>
</div>

<div class="container">

  <div class="menu-buttons">
    <button class="btn-prod" onclick="productos()">📦 Productos</button>
    <button class="btn-ventas" onclick="ventas()">💰 Ventas</button>
    <button class="btn-usuarios" onclick="irUsuarios()">👥 Usuarios</button>
  </div>

  <div id="contenido"></div>

</div>

<script src="app.js"></script>

<script>
if (!localStorage.getItem("auth")) {
  window.location.href = "/login";
}

function irMenu() {
  window.location.href = "/menu";
}

function irUsuarios() {
  window.location.href = "/usuarios";
}
</script>

</body>
</html>
